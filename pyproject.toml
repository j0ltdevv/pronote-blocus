[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pronote-blocus"
version = "0.1.0"
description = "Bot Telegram de rattrapage des devoirs PRONOTE"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21",
    "pronotepy==2.15.7",
    "cryptography>=42",
    "zxing-cpp>=2.2",
    "pillow>=10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "segno>=1.6"]

[tool.setuptools]
packages = ["app", "app.pronote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
